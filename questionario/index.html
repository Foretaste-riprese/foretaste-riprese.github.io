<style>
/* The questionnaire after the trial: the same meadow, type, glass, motion and sounds as the guide (index.html). */
:root {
  color-scheme: dark;
  /* the shadow behind the words: a tight dark edge for the letters, a wide soft halo for the line, like light on velvet */
  --halo: 0 1px 2px rgba(10,8,4,.5), 0 2px 14px rgba(10,8,4,.6), 0 0 34px rgba(10,8,4,.45);
  --halo-big: 0 1px 3px rgba(10,8,4,.45), 0 4px 26px rgba(10,8,4,.6), 0 0 64px rgba(10,8,4,.45);
  --ground: #2a2f1c;
  --ink: #F3EBDD;
  --soft: rgba(243, 235, 221, .85);
  --faint: rgba(243, 235, 221, .3);
  --line: rgba(243, 235, 221, .14);
  --champ: #D9C29A;
  --champ-hi: #E6D3B0;
  --deep: #17130C;
  --rec: #E0583F;
  --display: "Bodoni Moda", "Didot", "Times New Roman", serif;
  --body: Archivo, system-ui, -apple-system, sans-serif;
}
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--body); overflow-x: hidden; -webkit-text-size-adjust: 100%; }
a { color: var(--champ); }
button { font: inherit; cursor: pointer; border: 0; padding: 0; background: none; color: inherit; }
:focus-visible { outline: 2px solid var(--champ); outline-offset: 3px; }

/* the meadow in the wind, behind everything, with the guide's veil */
.prato { background: #4d5c34 url(../media/prato.webp) center/cover no-repeat; }
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
.prato-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.bg video::-webkit-media-controls, .bg video::-webkit-media-controls-start-playback-button, .bg video::-webkit-media-controls-overlay-play-button { display: none !important; -webkit-appearance: none; }
.veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(18,15,9,.5) 0%, rgba(18,15,9,.16) 28%, rgba(18,15,9,.16) 68%, rgba(18,15,9,.6) 100%); }
@media (prefers-reduced-motion: reduce) { .prato-video { display: none; } }

#app { position: relative; z-index: 1; }
.scr { position: relative; box-sizing: border-box; max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100svh;
  padding: calc(54px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(34px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; }
.brand { position: absolute; top: calc(21px + env(safe-area-inset-top, 0px)); left: 0; right: 0; margin: 0; text-align: center; font: 500 11px/1 var(--display); letter-spacing: .62em; text-indent: .62em; color: rgba(243,235,221,.9); transform: scaleY(.78); text-shadow: var(--halo); pointer-events: none; transition: opacity .3s; }
.sending .brand { opacity: 0; }
header { display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
main { flex: 1; display: flex; flex-direction: column; }
.dsp { font-family: var(--display); font-weight: 400; font-optical-sizing: auto; }
.dsp em { font-style: italic; color: var(--champ); }
h1, h2, p, .lab, .dsp, .link, .under { text-shadow: var(--halo); }
.h1, .q { text-shadow: var(--halo-big); }
.gl, .gl * { text-shadow: 0 1px 10px rgba(10,8,4,.4); }
.lab { font-family: var(--body); font-stretch: 125%; font-weight: 500; font-size: 10px; letter-spacing: .24em; text-transform: uppercase; }
.h1 { margin: 10px 0 0; font-size: 46px; line-height: 1.04; letter-spacing: -.012em; }
.q { margin: 12px 0 0; font-size: 28px; line-height: 1.13; letter-spacing: -.01em; text-wrap: balance; }
.q.long { font-size: 25px; }
.q em { color: var(--champ-hi); }
.lead { margin: 14px 0 0; font-size: 15px; line-height: 1.55; color: rgba(243,235,221,.9); max-width: 34ch; }
.hint { margin: 10px 0 0; font-family: var(--display); font-style: italic; font-size: 19px; line-height: 1.3; color: var(--champ-hi); text-shadow: var(--halo-big); }

/* glass for a screen that changes all the time: blur and rim over the live meadow (as in the guide) */
.gl { background: rgba(18,15,9,.18); -webkit-backdrop-filter: blur(16px) saturate(1.45); backdrop-filter: blur(16px) saturate(1.45); border: 1px solid rgba(255,255,255,.18); box-shadow: inset 1.5px 1.5px 0 rgba(255,255,255,.45), inset -1px -1px 0 rgba(255,255,255,.14), inset 0 0 24px rgba(255,255,255,.08), 0 14px 34px -16px rgba(8,6,3,.6); text-shadow: 0 1px 10px rgba(10,8,4,.4); color: var(--ink); box-sizing: border-box; }
button.gl, .gl.free { position: relative; }
button.gl { transition: transform .25s cubic-bezier(.3,.7,.2,1), background .25s; }
button.gl:active { transform: scale(.965); }
button.gl:hover { background: rgba(255,255,255,.08); }
.card { position: relative; border-radius: 22px; padding: 18px 20px 8px; }
.card::after, .btn-p::after { pointer-events: none; }
.li-row { display: grid; grid-template-columns: 34px 1fr; gap: 6px; padding: 10px 0; font-size: 15px; line-height: 1.45; }
.li-row + .li-row { border-top: 1px solid var(--line); }
.li-n { font-family: var(--display); font-style: italic; font-size: 17px; color: var(--champ); }
.snd { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 54px; border-radius: 999px; font: 600 15px var(--body); letter-spacing: .01em; box-sizing: border-box; padding: 0 20px; }
.btn-p { position: relative; overflow: hidden; background: var(--champ); color: var(--deep); transition: transform .25s cubic-bezier(.3,.7,.2,1); }
.btn-p:hover { background: var(--champ-hi); }
.btn-p:active { transform: scale(.965); }
.btn-p[disabled] { opacity: .5; cursor: default; }
nav { margin-top: auto; padding-top: 26px; display: flex; gap: 10px; }
.link { align-self: center; min-height: 44px; margin-top: 6px; color: var(--soft); font: 500 13px var(--body); text-decoration: underline; text-underline-offset: 3px; }

/* writing */
.answer { display: block; width: 100%; min-height: 168px; max-height: 52vh; border-radius: 20px; padding: 15px 17px; font: 400 16px/1.45 var(--body); color: var(--ink); resize: none; }
.answer::placeholder, .field::placeholder { color: rgba(243,235,221,.62); }
.field { display: block; width: 100%; min-height: 52px; border-radius: 18px; padding: 0 17px; font: 400 16px var(--body); color: var(--ink); }
.answer:focus, .field:focus { outline: 2px solid var(--champ); outline-offset: 2px; }
.under { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; font-size: 12px; color: rgba(243,235,221,.9); }
/* dictation: a glass pill under the answer; while listening it turns rec red and breathes */
.mic { display: inline-flex; align-items: center; gap: 9px; min-height: 44px; padding: 0 16px 0 13px; border-radius: 999px; font: 600 13px var(--body); white-space: nowrap; }
.mic svg { flex: none; }
button.gl.mic.on, button.gl.mic.on:hover { background: rgba(224,88,63,.88); border-color: rgba(255,255,255,.3); }
.mic.on .mic-dot { width: 8px; height: 8px; border-radius: 50%; background: #F3EBDD; animation: blink 1.4s ease-in-out infinite; }
.mic-tip { display: flex; align-items: center; gap: 8px; line-height: 1.4; }
.voices { display: flex; flex-direction: column; gap: 8px; }
.voices:not(:empty) { margin-top: 12px; }
.vchip { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto 44px; align-items: center; gap: 4px; min-height: 52px; padding: 0 4px; border-radius: 18px; font-size: 14px; }
.vplay, .vdel { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--ink); }
.vplay { color: var(--champ); }
.vt { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vs { font-size: 12px; color: rgba(243,235,221,.78); }
.mic-msg { margin: 10px 2px 0; font-size: 13px; line-height: 1.45; color: #F2B8A6; }
@media (prefers-reduced-motion: reduce) { .mic.on .mic-dot { animation: none; } }
.err { margin: 10px 0 0; color: #F2B8A6; font-size: 14px; }

/* progress: a thin champagne line per question of the part */
.segs { display: grid; gap: 6px; }
.segs span { height: 2px; background: var(--faint); }
.segs span.on { background: var(--champ); }
/* the six parts, lit one by one as the screen sets down (each one pops, as the points of the guide's plan) */
.dots { display: flex; gap: 10px; margin-top: 26px; }
.dot { width: 30px; height: 30px; box-sizing: border-box; border-radius: 50%; display: grid; place-items: center; font: 600 11px var(--body); position: relative; }
.dot.todo { background: rgba(42,47,28,.75); border: 1px solid rgba(243,235,221,.7); color: var(--ink); font-weight: 500; }
.dot.cur { background: var(--ink); color: var(--deep); }
.dot.done { background: var(--champ); color: var(--deep); }
.dot.cur::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1.2px solid var(--champ); animation: ring 1.8s ease-out infinite; }
@keyframes ring { from { transform: scale(.85); opacity: .9; } to { transform: scale(1.7); opacity: 0; } }
.anim .pt { animation: pt 420ms cubic-bezier(.22,1,.36,1) calc(var(--d0, 600ms) + var(--i) * 110ms) backwards; }
@keyframes pt { from { opacity: 0; transform: scale(.5); } }

/* the questions still without an answer, on the last screen */
.miss { display: grid; grid-template-columns: 34px 1fr 16px; gap: 6px; align-items: center; width: 100%; padding: 11px 0; text-align: left; font-size: 14px; line-height: 1.4; color: var(--ink); }
.miss + .miss { border-top: 1px solid var(--line); }

/* the note at the top while the answers travel */
.send { position: fixed; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top, 0px)); z-index: 40; display: flex; align-items: center; gap: 9px; max-width: calc(100% - 32px); min-height: 28px; padding: 0 14px; border-radius: 999px; font: 600 12px var(--body); color: var(--ink); background: rgba(18,15,9,.62); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.16); white-space: nowrap; }
.send-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--champ); animation: blink 1.4s ease-in-out infinite; flex: none; }
.send.ok .send-dot { animation: none; background: #B9D49A; }
.send.err .send-dot { animation: none; background: var(--rec); }
@keyframes blink { 50% { opacity: .3; } }

/* Posa: each piece rises from its own base line, lifts a little, tilted up to the right like a cup held by the wrist, then sets down flat. */
.posa { display: block; --tilt: -1.8deg; --dur: 820ms; }
.posa.l { --tilt: -.9deg; }
.posa > * { transform-origin: 20% 100%; }
.anim .posa { animation: posa-clip var(--dur) linear var(--d, 0ms) backwards; }
.anim .posa > * { animation: posa var(--dur) linear var(--d, 0ms) backwards; }
@keyframes posa-clip { 0%, 99.9% { clip-path: inset(-120px -120px -.15em -120px); } 100% { clip-path: none; } }
@keyframes posa { 0% { transform: translateY(calc(100% + 8px)) rotate(calc(var(--tilt) * 1.4)); animation-timing-function: cubic-bezier(.2,.75,.25,1); } 58% { transform: translateY(-9px) rotate(var(--tilt)); animation-timing-function: cubic-bezier(.45,0,.3,1); } 100% { transform: translateY(0) rotate(0deg); } }
/* glass can't sit in a clipping wrapper: it fades in with the same lift */
.free { transform-origin: 20% 100%; --tilt: -.9deg; --dur: 820ms; }
.anim .free { animation: posa-free var(--dur) linear var(--d, 0ms) backwards; }
@keyframes posa-free { 0% { opacity: 0; transform: translateY(40px) rotate(calc(var(--tilt) * 1.4)); animation-timing-function: cubic-bezier(.2,.75,.25,1); } 25% { opacity: 1; } 58% { transform: translateY(-9px) rotate(var(--tilt)); animation-timing-function: cubic-bezier(.45,0,.3,1); } 100% { opacity: 1; transform: translateY(0) rotate(0deg); } }
.seg-new { transform-origin: left center; }
.anim .seg-new { animation: seg 700ms cubic-bezier(.22,1,.36,1) var(--d, 520ms) backwards; }
@keyframes seg { from { transform: scaleX(0); } }
/* the rim of light running round the glass, and the sheen on the champagne button */
.gl.free::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; opacity: 0; pointer-events: none; background: linear-gradient(100deg, transparent 35%, rgba(255,255,255,.95) 50%, transparent 65%) 0 0/300% 100% no-repeat; -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.anim .gl.free::before { animation: rim 1.3s cubic-bezier(.45,0,.3,1) calc(var(--d, 0ms) + 600ms) backwards; }
@keyframes rim { 0% { opacity: 1; background-position: 100% 0; } 80% { opacity: 1; } 100% { opacity: 0; background-position: 0 0; } }
.btn-p::after { content: ""; position: absolute; inset: 0; opacity: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.5) 50%, transparent 65%); }
.anim .btn-p::after { animation: sheen 1.2s cubic-bezier(.45,0,.3,1) calc(var(--d, 0ms) + 700ms) backwards; }
@keyframes sheen { 0% { opacity: 1; transform: translateX(-100%); } 90% { opacity: 1; } 100% { opacity: 0; transform: translateX(100%); } }
/* between screens the motion is reset for a frame, so the next screen's pieces set down again */
.prep .scr { opacity: 0; }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .anim .posa, .anim .gl.free::before, .anim .btn-p::after, .anim .seg-new, .anim .pt, .dot.cur::after, .send-dot { animation: none; }
  .anim .posa > *, .anim .free { animation: fade .4s ease var(--d, 0ms) backwards; }
}
</style>
</head>
<body>
<div class="bg prato" aria-hidden="true">
  <video class="prato-video" src="../media/prato-vento.mp4" poster="../media/prato.webp" autoplay muted loop playsinline preload="auto"></video>
  <div class="veil"></div>
</div>
<div id="app" class="anim"></div>
<div class="send" id="send" hidden aria-live="polite"><span class="send-dot" aria-hidden="true"></span><span id="send-t"></span></div>

<script>
// ---- The questionnaire after the trial. One question a screen, saved on the phone as it is written, and sent by
// itself to the owner's Drive (sheet «Questionario della prova», one row per person, updated as they go on). ----
const CFG = window.GUIDA_CONFIG || {};
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// *word* in a question is the part set in champagne italic, as in the guide's titles
const rich = (t) => esc(t).replace(/\*([^*]+)\*/g, '<em>$1</em>');
const plain = (t) => String(t).replace(/\*/g, '');

const PARTS = [
  { t1: 'Esigenze', t2: 'e aspettative', name: 'Esigenze e aspettative', qs: [
    { t: 'Prima di provare il servizio, quali erano le tue *aspettative*?', h: 'Cosa ti aspettavi di ottenere?' },
    { t: 'Quali difficoltà incontri attualmente nel mostrare ai potenziali ospiti *le caratteristiche e gli spazi* dei tuoi alloggi?' },
    { t: 'Cosa vorresti che un video walkthrough facesse *concretamente per te*?' },
    { t: 'Cosa vorresti che il video facesse *per i tuoi clienti*?' }] },
  { t1: 'L’esperienza', t2: 'di registrazione', name: 'Esperienza di registrazione', qs: [
    { t: 'Quanto *tempo* hai impiegato per registrare tutto il materiale richiesto?' },
    { t: 'Quali istruzioni della guida ti sono sembrate *poco chiare*, difficili da seguire o superflue?' },
    { t: 'Ci sono stati momenti in cui *non sapevi esattamente cosa fare* o come registrare una determinata parte dell’alloggio?' },
    { t: 'Quale parte della registrazione ti ha richiesto *più tempo o fatica*?' },
    { t: 'Se dovessi ripetere il procedimento su un altro alloggio, *cosa cambieresti*?' },
    { t: 'Cosa potremmo fare per rendere la registrazione *più semplice*, veloce e meno impegnativa?' }] },
  { t1: 'Il video', t2: 'finale', name: 'Valutazione del video finale', qs: [
    { t: 'Il video rispecchia *fedelmente* l’alloggio reale?', h: 'Se noti differenze, quali sono?' },
    { t: 'Quanto il video riesce a trasmettere correttamente *le dimensioni, la disposizione* e le caratteristiche degli ambienti?' },
    { t: 'Ci sono elementi che risultano *poco realistici*, modificati o diversi dalla realtà?' },
    { t: 'Il percorso all’interno della casa è *naturale* e permette di comprendere bene gli spazi?' },
    { t: 'Quali sono gli aspetti del video che *ti sono piaciuti* maggiormente?' },
    { t: 'Quali sono gli aspetti che *miglioreresti*?' },
    { t: 'Se potessi modificare liberamente qualcosa del risultato, *cosa cambieresti*?' }] },
  { t1: 'Utilità', t2: 'e valore', name: 'Utilità e valore del servizio', qs: [
    { t: 'In che modo utilizzeresti questo video nella *gestione e nella promozione* dei tuoi alloggi?' },
    { t: 'Dove lo mostreresti ai tuoi *potenziali ospiti*?', h: 'Ad esempio annunci, sito web, messaggi diretti o altri canali.' },
    { t: 'Secondo te, in che modo potrebbe cambiare *la percezione dell’alloggio* da parte di un potenziale cliente?' },
    { t: 'Ritieni che possa aiutare un cliente a capire meglio *cosa sta prenotando*?', h: 'Perché?' },
    { t: 'Quali *vantaggi concreti* potrebbe portarti questo servizio?' },
    { t: 'C’è qualcosa che ti aspettavi di trovare nel servizio e che invece *manca*?' }] },
  { t1: 'La parte', t2: 'commerciale', name: 'Valutazione commerciale', qs: [
    { t: 'Acquisteresti questo servizio per *uno o più dei tuoi alloggi*?', h: 'Perché?' },
    { t: 'Quanto saresti disposto a pagare per realizzare un video di questo tipo per *una singola proprietà*?', p: 'Es. 150 €, e perché questa cifra' },
    { t: 'Da cosa dipenderebbe la tua *decisione di acquistarlo*?' },
    { t: 'Quali caratteristiche o miglioramenti renderebbero il servizio più interessante e *giustificherebbero un prezzo maggiore*?' },
    { t: 'Preferiresti acquistare *un singolo video* oppure un servizio continuativo per più proprietà?', h: 'Perché?' }] },
  { t1: 'Per', t2: 'finire', name: 'Considerazioni finali', qs: [
    { t: 'Qual è il *problema più importante* che abbiamo riscontrato durante questa prova?' },
    { t: 'Se potessi darci *un solo consiglio* per migliorare Vistara, quale sarebbe?' },
    { t: 'C’è qualcos’altro che vorresti aggiungere e che *non ti abbiamo chiesto*?' }] }
];
// every question numbered 1–31, with its part
const QS = [];
PARTS.forEach((p, pi) => p.qs.forEach((q, k) => QS.push(Object.assign({ n: QS.length + 1, part: pi, k }, q))));
const fullText = (q) => plain(q.t) + (q.h ? ' ' + q.h : '');
// the screens in order: welcome, then each part (its title, its questions), the last look, thank you
const SEQ = [{ t: 'intro' }];
PARTS.forEach((p, pi) => { SEQ.push({ t: 'part', p: pi }); QS.filter((q) => q.part === pi).forEach((q) => SEQ.push({ t: 'q', n: q.n })); });
SEQ.push({ t: 'review' }, { t: 'thanks' });
const MINUTES = (pi) => Math.max(2, Math.round(PARTS[pi].qs.length * 0.6));
const ROMAN = ['i.', 'ii.', 'iii.', 'iv.', 'v.', 'vi.'];

// ---------- who answers: from the link (?casa=…&nome=…), otherwise asked on the first screen ----------
const QP = new URLSearchParams(location.search);
const LINK = { casa: (QP.get('casa') || '').trim(), nome: (QP.get('nome') || '').trim() };
const KEY = 'questionario-v1:' + LINK.casa + '|' + LINK.nome;
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
let S = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (_) { return null; } })();
if (!S || !S.id) S = { id: newId(), nome: LINK.nome, casa: LINK.casa, a: {}, v: {}, idx: 0, finito: false, fromReview: false };
if (!S.v) S.v = {};   // the answers given aloud: per question, [{ id, d: seconds, t: type, link }]
if (LINK.casa) S.casa = LINK.casa;
if (LINK.nome) S.nome = LINK.nome;
let saveT = null;
function save(now) {
  clearTimeout(saveT);
  const w = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (_) {} };
  if (now) w(); else saveT = setTimeout(w, 300);
}
const hasAnswer = (n) => !!((S.a[n] || '').trim() || (S.v[n] || []).length);
const answered = () => QS.filter((q) => hasAnswer(q.n)).length;

function voiceDone(v) {

async function voicePump() {

    for (const q of QS) {

async function voiceSend(n, i, x, blob) {

}

if (cur().t === 'thanks') S.idx = idxOf((x) => x.t === 'thanks');
SND.on = !!SND.shared().on;
if (SND.on) SND.start(SND.shared().time);
draw();
// anything written while offline last time goes now
if (answered()) queueSend();
voicePump();
window.addEventListener('online', voicePump);
</script>
